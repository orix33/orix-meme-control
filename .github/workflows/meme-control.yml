name: Meme-Control 24/7

# Laesst den Paper-Kontrollversuch stuendlich laufen — auch wenn Marks PC aus ist.
#
# TAKT
# ----
# Alle 20 Minuten, weil dieses Repo OEFFENTLICH ist: Dort sind Actions-Minuten
# unbegrenzt. In einem privaten Repo waeren es 2.000 Freiminuten im Monat, und
# bei ~2 Minuten je Zyklus passte nur stuendlich (~1.450/Monat) — alle 20 min
# waeren ~4.300 und wuerden Kosten ausloesen.
#
# WICHTIG bei oeffentlichen Repos: GitHub schaltet geplante Workflows nach
# 60 Tagen ohne Repository-Aktivitaet automatisch ab. Da dieser Workflow bei
# jedem Lauf den Zustand zurueckschreibt, erzeugt er selbst Aktivitaet — die
# Abschaltung greift also nicht, solange er laeuft.
#
# KEINE SECRETS NOETIG. Der Versuch nutzt ausschliesslich freie oeffentliche
# APIs (GeckoTerminal, RugCheck, IPFS). Es gibt hier keinen einzigen Schluessel
# und keinen Pfad zu einer Order.

on:
  schedule:
    # Alle 20 Minuten. In einem OEFFENTLICHEN Repo sind Actions-Minuten
    # unbegrenzt — der Takt kostet also nichts und die Stichprobe waechst
    # dreimal so schnell. Bewusst auf 7/27/47 statt 0/20/40: zur vollen und
    # halben Stunde ist GitHubs Scheduler am staerksten ausgelastet und
    # verzoegert Laeufe am meisten.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:          # zum Testen von Hand ausloesbar

# Zwei gleichzeitige Laeufe wuerden denselben Zustand schreiben und sich
# ueberholen — dasselbe Problem wie zwei Runner auf einem Rechner.
concurrency:
  group: meme-control
  cancel-in-progress: false

permissions:
  contents: write             # noetig, um den Zustand zurueckzuschreiben

jobs:
  zyklus:
    runs-on: ubuntu-latest
    timeout-minutes: 12       # ein Zyklus braucht ~2 min; 12 faengt Haenger ab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # Keine Abhaengigkeiten zu installieren: der Versuch laeuft auf reiner
        # Standardbibliothek. Kein requirements.txt, kein pip.

      - name: Zyklus ausfuehren
        working-directory: py
        run: python cycle.py

      - name: Zustand zurueckschreiben
        run: |
          git config user.name  "meme-control-bot"
          git config user.email "actions@github.com"
          git add py/data/
          if git diff --staged --quiet; then
            echo "Keine Aenderung am Zustand — nichts zu committen."
          else
            git commit -m "Kontrollversuch: Zyklus $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Ein paralleler Lauf koennte inzwischen gepusht haben.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Bericht in die Lauf-Zusammenfassung
        if: always()
        working-directory: py
        run: |
          {
            echo '```'
            python -c "import sys; sys.path.insert(0,'.'); import meme_control as MC; print(MC.report())"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
